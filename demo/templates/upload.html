<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Video</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background: linear-gradient(120deg, #0f2027, #203a43, #2c5364); min-height: 100vh; color: white;">

<div class="container">
    <div class="center-container">
        <br/>
        <h2 class="mb-4">📤 Drop Your Action!</h2>
        <br/>
        <input type="file" id="videoUpload" accept=".mp4,.webm,.avi,.mov,.mkv" class="form-control custom-file-input mb-3">

        <video id="uploadedVideo" controls class="small-video mb-3"></video>

        <button id="uploadBtn" class="btn btn-primary mb-3" style="background-color: #045709; color: white;">Guess My Move!</button>
        <br/>
        <div id="resultMsg" class="text-success" style="color: #e6d6de !important; font-size: 24px; font-weight: bold; text-shadow: 1px 0.5px 1px rgba(12, 12, 12, 0.8);"></div>
        <br/><br/><br/>
    </div>
</div>

<script>
document.getElementById('uploadBtn').onclick = () => {
    const input = document.getElementById('videoUpload');
    const file = input.files[0];
    if (!file) return alert("Please select a video to upload.");

    const formData = new FormData();
    formData.append('video', file);

    fetch('/upload', {
        method: 'POST',
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('resultMsg').innerText = "Action Recognized: " + data.message;
        if (data.video_path) {
            const video = document.getElementById('uploadedVideo');
            video.src = data.video_path;
            video.play();
        }
    })
    .catch(err => {
        console.error('Upload failed:', err);
        alert('Failed to upload video.');
    });
};
</script>

</body>
</html>
