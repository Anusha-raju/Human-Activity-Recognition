<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Record Video</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background: linear-gradient(120deg, #0f2027, #203a43, #2c5364); min-height: 100vh; color: white;">

<div class="container">
    <div class="center-container">
        <br/>
        <h2 class="mb-4">🎥 Ready... Set... Record!</h2>
        <br/>
        <video id="recordedVideo" class="small-video mb-3" controls playsinline></video>

        <div class="d-flex gap-2 mb-3">
            <button id="startRecord" class="btn btn-warning">Start Recording</button>
            <button id="stopRecord" class="btn btn-danger" disabled>Stop Recording</button>
            <br/><br/>
        </div>
        <button id="uploadRecord" class="btn btn-primary" style="background-color: #045709; color: white;" disabled>Predict My Move</button>
        <br/>
        <div id="resultMsg" class="text-success" style="color: #e6d6de !important; font-size: 24px; font-weight: bold; text-shadow: 1px 0.5px 1px rgba(12, 12, 12, 0.8);"></div>

        <br/><br/><br/>
    </div>
</div>

<script>
let mediaRecorder;
let recordedChunks = [];
let stream;

document.getElementById('startRecord').onclick = async () => {
    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const video = document.getElementById('recordedVideo');
        video.srcObject = stream;
        video.play();
        video.setAttribute('playsinline', true);

        recordedChunks = []; 
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) {
                recordedChunks.push(event.data);
            }
        };

        mediaRecorder.onstop = () => {
            const videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
            const videoUrl = URL.createObjectURL(videoBlob);
            const video = document.getElementById('recordedVideo');

            video.srcObject = null;
            video.src = videoUrl;
            video.play();
            video.setAttribute('playsinline', true);

            document.getElementById('uploadRecord').disabled = false;
        };

        mediaRecorder.start();
        document.getElementById('startRecord').disabled = true;
        document.getElementById('stopRecord').disabled = false;
    } catch (error) {
        console.error('Error accessing camera:', error);
        alert('Could not access your camera. Please check permissions.');
    }
};

document.getElementById('stopRecord').onclick = () => {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        stream.getTracks().forEach(track => track.stop());
    }
    document.getElementById('startRecord').disabled = false;
    document.getElementById('stopRecord').disabled = true;
};

document.getElementById('uploadRecord').onclick = async () => {
    if (recordedChunks.length === 0) {
        alert('No recorded video available to upload.');
        return;
    }

    const formData = new FormData();
    const videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
    formData.append('video', videoBlob, 'recorded_video.webm');

    try {
        const response = await fetch('/record', {
            method: 'POST',
            body: formData
        });
        const data = await response.json();
        document.getElementById('resultMsg').innerText = "Action Recognized: " + data.message;

        if (data.video_path) {
            const video = document.getElementById('recordedVideo');
            video.srcObject = null;
            video.src = data.video_path;
            video.play();
            video.setAttribute('playsinline', true);
        }

        recordedChunks = [];
        document.getElementById('uploadRecord').disabled = true;
    } catch (error) {
        console.error('Upload failed:', error);
        alert('Failed to upload recorded video.');
    }
};
</script>
</body>
</html>
